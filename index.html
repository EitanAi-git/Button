<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Click the Button</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --text: #1d1d1f;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111114;
        --text: #f5f5f7;
        --accent: #818cf8;
        --accent-hover: #6366f1;
      }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }
    button {
      font-size: 1.25rem;
      padding: 0.9rem 2.2rem;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: background 0.15s, transform 0.08s;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.95); }
    button:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
    #message { font-size: 1.1rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <button id="btn" type="button">Click me!</button>
  <p id="message" aria-live="polite">You haven't clicked yet.</p>

  <script>
    const btn = document.getElementById('btn');
    const message = document.getElementById('message');
    let count = 0;

    btn.addEventListener('click', () => {
      count++;
      message.textContent = `You clicked the button ${count} time${count === 1 ? '' : 's'}!`;
    });
  </script>
</body>
</html>
